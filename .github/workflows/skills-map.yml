name: Update skills map

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "scripts/build_index.py"
      - "README.md"
  pull_request:
    paths:
      - "skills/**"

permissions:
  contents: write

jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild README skills map
        run: python3 scripts/build_index.py
      - name: Commit if changed (main only)
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Update skills map"
            git push
          fi
      - name: Fail PR if map is stale
        if: github.event_name == 'pull_request'
        run: |
          git diff --exit-code README.md || (echo "Run python3 scripts/build_index.py and commit README.md" && exit 1)
